; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = cmsis
upload_protocol = dfu
; remova qualquer coisa anterior relacionada a mfloat-abi/mfpu
build_unflags =
    -mfloat-abi=hard
    -mfloat-abi=soft
    -mfpu=fpv4-sp-d16
    -mfpu=fpv5-sp-d16
; use softfp em TODAS as fases (compile e link)
build_flags =
    -mcpu=cortex-m4
    -mthumb
    -mfloat-abi=softfp
    -mfpu=fpv4-sp-d16
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Iinclude
    -Ilib/FreeRTOS-Kernel/include
    -Ilib/FreeRTOS-Kernel/portable/GCC/ARM_CM4F
    -Isrc

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<input/debounce.c>
build_flags =
    -Iinclude
lib_deps =
    throwtheswitch/Unity @ ^2.6.1